<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>日本自然 100 選（日本の自然 100 選） </title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@700;800&family=Noto+Serif+TC:wght@700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>:root{color-scheme:light dark}:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}html,body{margin:0;background:light-dark(#fff,#0d1612)}</style>
<style id="nl-css">/* VOICE everyday: a calm field guide; in edit mode a quiet admin layer on top of the same page
   IDEA a pocket nature-guide index: a stamped number, a name, where, and why it was chosen
   PICTURE a tile map of Japan's 47 prefectures shaded by matches, also the main filter
   COLOUR forest green header, white pages, vermilion seal-stamp accent
   TYPE Noto Serif JP 800 for headings and numbers (as on NivoseLab), Noto Sans TC for text
   LAYOUT green header with ridges; sticky map + filters left, list right; stacks in narrow containers */
.nl{color-scheme:light dark;--bg:light-dark(#ffffff,#0d1612);--ink:light-dark(#15241c,#e5eee8);--mute:light-dark(#56675d,#9db2a5);--line:light-dark(#e2e9e4,#213229);--panel:light-dark(#f3f7f4,#14211b);--edge:light-dark(#c9d5cd,#2c4237);--g:#1b4a35;--g3:#2f6b4f;--red:#cf3f27;--t0:light-dark(#eef2ef,#18241e);--t1:light-dark(#c4dccd,#24443a);--t2:light-dark(#7fb196,#2f6b4f);--t3:light-dark(#3f8063,#4f9a75);--t4:light-dark(#1f5a40,#7cc49d);--serif:"Noto Serif JP","Noto Serif TC",serif;container:nl/inline-size;background:var(--bg);color:var(--ink);font:16px/1.65 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;overflow-x:clip;text-align:start}
:root[data-theme=light] .nl{color-scheme:light}
:root[data-theme=dark] .nl{color-scheme:dark}
.nl.light{color-scheme:light}
.nl *{box-sizing:border-box;min-width:0}
.nl h1,.nl h2,.nl h3{font-family:var(--serif);font-weight:800;margin:0;letter-spacing:-.01em;color:inherit;background:none;border:0;padding:0;display:block}
.nl p{margin:0;padding:0}
.nl ul{margin:0}
.nl button{font-family:inherit}
.nl .band{padding-block:clamp(28px,4vw,56px);padding-left:max(5vw,16px);padding-right:max(5vw,16px)}
.nl .wrap{max-width:1240px;margin:0 auto}
.nl .hero{background:var(--g);color:#eef6f0;padding-bottom:0}
.nl .hero h1{font-size:clamp(38px,6vw,60px);line-height:1.1;text-wrap:balance}
.nl .sub{font-family:var(--serif);font-weight:700;font-size:clamp(18px,2.2vw,23px);margin-top:12px;color:#cfe6d7}
.nl .lede{max-width:62ch;margin-top:16px;color:#d9ebdf}
.nl .lede p+p{margin-top:8px}
.nl .figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(9em,1fr));gap:4px 24px;margin-top:28px;max-width:820px}
.nl .fig1{border-top:1px solid #ffffff33;padding-top:10px;position:relative}
.nl .fig1 b{display:block;font:800 clamp(26px,3vw,34px)/1.15 var(--serif);color:#fff;white-space:nowrap}
.nl .fig1 span{display:block;font-size:14px;color:#bcd8c6}
.nl .ridge{display:block;width:calc(100% + 2*max(5vw,16px));max-width:none;height:130px;margin:8px calc(-1*max(5vw,16px)) 0}
.nl .mapbox{max-width:520px}
.nl .main{display:grid;gap:32px;padding-top:8px}
@container nl (min-width:900px){.nl .main{grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:48px}.nl .side{position:sticky;top:16px;align-self:start;max-height:calc(100svh - 32px);overflow:auto;padding-bottom:8px}.nl.editing .side{top:76px;max-height:calc(100svh - 92px)}}
.nl .side h2{font-size:22px}
.nl .hint{color:var(--mute);font-size:14px;margin:4px 0 12px}
.nl .mapbox{container:map/inline-size;background:var(--panel);border-radius:14px;padding:14px}
.nl .map{display:grid;grid-template-columns:repeat(26,minmax(0,1fr));grid-template-rows:repeat(29,minmax(0,1fr));gap:0;aspect-ratio:26/29}
.nl .t{border:0;border-radius:5px;background:var(--t0);color:var(--ink);font:500 13px/1 "Noto Sans TC",sans-serif;cursor:pointer;display:grid;place-items:center;padding:0;margin:1.5px;font-size:clamp(9px,3cqi,13px);white-space:nowrap;overflow:hidden;transition:background .25s,transform .15s}
.nl .t[data-n="1"]{background:var(--t1)}.nl .t[data-n="2"]{background:var(--t2);color:#fff}.nl .t[data-n="3"]{background:var(--t3);color:#fff}.nl .t[data-n="4"]{background:var(--t4);color:light-dark(#fff,#0d1612)}
.nl .t[data-n="0"]{color:var(--mute);cursor:default}
.nl .t.s3{font-size:clamp(7px,2.15cqi,12px);letter-spacing:-.05em}
.nl .t:hover:not([data-n="0"]){transform:scale(1.08)}
.nl .t.on{background:var(--red);color:#fff}
@container map (max-width:380px){.nl .t span{display:none}}
.nl :is(.t,.chip,.btn,.no,.ebtn,.reset,.close):focus-visible,.nl :is(select,input,textarea):focus-visible{outline:3px solid var(--red);outline-offset:2px}
.nl .legend{display:flex;align-items:center;gap:6px;margin-top:12px;font-size:13px;color:var(--mute);flex-wrap:wrap}
.nl .legend i{width:16px;height:16px;border-radius:3px;display:inline-block}
.nl .ctl{display:grid;gap:12px;margin-top:18px}
.nl .chips{display:flex;flex-wrap:wrap;gap:6px}
.nl .chip{min-height:40px;padding:6px 14px;border-radius:99px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:500 15px "Noto Sans TC",sans-serif;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.nl .chip[aria-pressed=true]{background:var(--g);border-color:var(--g);color:#fff}
.nl .dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.nl .row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.nl .lab{display:block;color:var(--mute);font-size:14px;margin:0 0 4px}
.nl select,.nl input:not([type=checkbox]):not([type=color]):not([type=file]),.nl textarea{width:100%;min-height:44px;font:16px/1.5 "Noto Sans TC",sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--edge);border-radius:10px;padding:8px 12px;margin:0}
.nl textarea{resize:vertical}
.nl .status{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:15px;color:var(--mute)}
.nl .status b{color:var(--ink);font-variant-numeric:tabular-nums}
.nl .reset{border:0;background:none;color:var(--red);font:500 15px "Noto Sans TC",sans-serif;cursor:pointer;min-height:44px;padding:0 4px}
.nl .pref{display:flex;align-items:baseline;gap:10px;border-bottom:2px solid var(--ink);padding:26px 0 8px}
.nl .pref:first-child{padding-top:0}
.nl .pref h2{font-size:26px}
.nl .pref small{color:var(--mute);font-size:14px}
.nl .item{display:grid;grid-template-columns:52px minmax(0,1fr) minmax(0,240px);gap:4px 20px;padding:20px 0;border-bottom:1px solid var(--line)}
.nl .body{position:relative}
.nl .item h3{font-size:22px;line-height:1.3}
.nl .jp{display:block;margin-top:3px;font-size:14px;line-height:1.5;color:var(--mute);font-family:"Noto Sans TC",sans-serif;font-weight:400;letter-spacing:0}
.nl .meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px;color:var(--mute);margin:6px 0}
.nl .meta .k{display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.nl .item p{max-width:62ch;line-height:1.9;text-align:justify}
.nl .note{display:block;margin-top:6px;font-size:14px;color:var(--red)}
.nl .side-fig{display:grid;gap:8px;align-content:start}
.nl .mini{display:block;width:100%;aspect-ratio:13/14.5;background:var(--panel);border-radius:8px;padding:8px;color:var(--t1)}
.nl .mini .hi{fill:var(--red)}
.nl .photo{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;background:var(--panel)}
.nl .gm{display:block;width:100%;aspect-ratio:4/3;border:0;border-radius:10px;background:var(--panel)}
.nl .gmfb{display:grid;align-content:center;gap:6px;aspect-ratio:4/3;border-radius:10px;background:var(--panel);border:1px dashed var(--edge);padding:14px;font-size:14px;color:var(--mute);line-height:1.5}
.nl .gmfb b{color:var(--ink);font-weight:500}
.nl .gmfb a{color:var(--g3);font-weight:500}
.nl .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:6px 16px;border-radius:99px;border:1px solid var(--edge);background:var(--bg);color:var(--ink);font:500 15px/1.2 "Noto Sans TC",sans-serif;text-decoration:none;text-align:center;cursor:pointer;white-space:nowrap}
.nl .btn:hover{border-color:var(--g3)}
.nl .btn.pri{background:var(--g);border-color:var(--g);color:#fff}
.nl .btn.warn{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,transparent)}
.nl .btn[disabled]{opacity:.45;cursor:default}
.nl .stamp{position:relative;align-self:start}
.nl .no{width:48px;height:48px;border-radius:50%;border:2px solid var(--red);color:var(--red);background:var(--bg);padding:0;cursor:pointer;display:grid;place-items:center;font:800 17px/1 var(--serif);font-variant-numeric:tabular-nums;transform:rotate(-6deg)}
.nl .no:hover,.nl .no:focus-visible{background:var(--red);color:#fff}
.nl .pop{position:absolute;left:56px;top:-8px;width:210px;z-index:5;background:var(--bg);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgb(0 0 0/.16);padding:8px;opacity:0;visibility:hidden;transform:translateY(4px);transition:opacity .18s,transform .18s,visibility .18s;pointer-events:none}
.nl .pop small{display:block;font-size:13px;color:var(--mute);padding:6px 2px 0;line-height:1.4}
.nl .stamp:hover .pop,.nl .stamp:focus-within .pop{opacity:1;visibility:visible;transform:none}
.nl .empty{padding:40px 0;color:var(--mute)}
.nl .about{background:var(--panel);margin-top:48px}
.nl .cols{display:grid;gap:24px 48px}
@container nl (min-width:760px){.nl .cols{grid-template-columns:repeat(auto-fit,minmax(0,1fr))}}
.nl .col{position:relative}
.nl .about h2{font-size:24px;margin-bottom:8px}
.nl .about p,.nl .about li{max-width:62ch;color:light-dark(#2a3a31,#cddbd2)}
.nl .about p+p{margin-top:10px}
.nl .about ul{padding-left:1.2em}
.nl .src{font-size:14px;color:var(--mute);margin-top:24px}
/* edit layer */
.nl .bar{position:sticky;top:0;z-index:30;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px max(5vw,16px);background:light-dark(#fffdf7,#16201b);border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgb(0 0 0/.06)}
.nl .bar .who{font-weight:700;margin-right:4px}
.nl .bar .st{font-size:14px;color:var(--mute);margin-right:auto}
.nl .bar .st.dirty{color:var(--red)}
.nl .bar .btn{min-height:40px;padding:4px 14px;font-size:14px}
.nl .fab{position:fixed;right:16px;bottom:16px;z-index:30;box-shadow:0 6px 18px rgb(0 0 0/.2)}
.nl .notice{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px max(5vw,16px);background:light-dark(#fdf0e8,#2a1b14);font-size:15px}
.nl.editing [data-k]{outline:1px dashed color-mix(in srgb,currentColor 35%,transparent);outline-offset:4px;border-radius:4px;cursor:text;min-height:1.2em}
.nl.editing [data-k]:hover{outline-color:currentColor}
.nl.editing [data-k]:focus{outline:2px solid var(--red)}
.nl.editing [data-multi]{white-space:pre-wrap}
.nl [data-k]:empty::before{content:attr(data-ph);opacity:.5}
.nl .ebtn{min-height:36px;padding:2px 12px;border-radius:99px;border:1px solid var(--edge);background:var(--bg);color:var(--ink);font:500 14px "Noto Sans TC",sans-serif;cursor:pointer}
.nl .ebtn:hover{border-color:var(--red);color:var(--red)}
.nl .body .ebtn{position:absolute;top:-4px;right:0}
.nl.editing .body h3{padding-right:64px}
.nl .x{position:absolute;top:6px;right:0;width:32px;height:32px;min-height:0;padding:0;border-radius:50%;border:0;background:#ffffff22;color:inherit;cursor:pointer;font-size:18px;line-height:1}
.nl .about .x{background:var(--line)}
.nl .addrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.nl .hero .ebtn{background:transparent;color:#fff;border-color:#ffffff66}
.nl .addit{width:100%;margin-top:20px;min-height:56px;border:2px dashed var(--edge);border-radius:12px;background:none;color:var(--ink);font:500 16px "Noto Sans TC",sans-serif;cursor:pointer}
.nl .modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgb(10 20 15/.45)}
.nl .modal[hidden]{display:none}
.nl .mbox{width:min(680px,100%);max-height:calc(100svh - 32px);overflow:auto;background:var(--bg);color:var(--ink);border-radius:16px;padding:clamp(18px,3vw,28px);box-shadow:0 20px 50px rgb(0 0 0/.3);position:relative}
.nl .mbox h2{font-size:24px;margin-bottom:16px;padding-right:44px}
.nl .close{position:absolute;top:14px;right:14px;width:44px;height:44px;border:0;border-radius:50%;background:var(--panel);color:var(--ink);font-size:22px;cursor:pointer}
.nl .fgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.nl .fgrid>.w{grid-column:1/-1}
.nl .fgrid label{display:block}
.nl .imgbox{display:grid;grid-template-columns:140px minmax(0,1fr);gap:12px;align-items:start}
.nl .imgbox .pv{width:140px;aspect-ratio:4/3;border-radius:8px;background:var(--panel);display:grid;place-items:center;overflow:hidden;font-size:13px;color:var(--mute);text-align:center}
.nl .imgbox .pv img{width:100%;height:100%;object-fit:cover}
.nl .imgbox .acts2{display:flex;flex-wrap:wrap;gap:8px}
.nl .small{font-size:14px;color:var(--mute);margin-top:6px}
.nl .err{color:var(--red);font-size:14px;min-height:1.4em;margin-top:10px}
.nl .mact{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.nl .mact .sp{flex:1}
.nl .catrow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:8px;align-items:center;margin-bottom:8px}
.nl .catrow input[type=color]{width:44px;height:44px;border:1px solid var(--edge);border-radius:10px;padding:2px;background:var(--bg)}
.nl .xopts{display:grid;grid-template-columns:repeat(auto-fit,minmax(14em,1fr));gap:12px}
.nl .xo{border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:8px;align-content:start}
.nl .xo h3{font-size:19px}
.nl .xo p{font-size:14px;color:var(--mute)}
.nl .xo .row{display:flex;flex-wrap:wrap;gap:8px}
.nl .code{margin-top:12px;font:13px/1.5 ui-monospace,Menlo,monospace;min-height:120px}
.nl .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:15px;max-width:calc(100% - 32px)}
@container nl (max-width:600px){.nl .item{grid-template-columns:44px minmax(0,1fr);gap:4px 12px}.nl .side-fig{grid-column:2;margin-top:12px}.nl .gm,.nl .gmfb{aspect-ratio:16/10}.nl .pop{left:46px;width:170px}.nl .no{width:40px;height:40px;font-size:15px}.nl .item h3{font-size:20px}.nl .fgrid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.nl .fgrid>.n3{grid-column:1/-1}.nl .imgbox{grid-template-columns:minmax(0,1fr)}.nl .bar .st{flex-basis:100%;order:-1}}
@media(prefers-reduced-motion:reduce){.nl .pop,.nl .t{transition:none}.nl .t:hover:not([data-n="0"]){transform:none}}
</style>
</head>

<script type="application/json" id="nl-state">{"v":1,"title":"日本自然 100 選（日本の自然 100 選） ","sub":"想留給 21 世紀的日本自然環境","lede":"1982年，森林文化協會與朝日新聞社向全日本徵集「想留給 21 世紀的自然環境」。由於國家公園等已受保護的地方不在評選範圍內，因此許多提名地點都是人們熟知的地點或面臨破壞風險的自然區域。\n100 處入選地於 1983 年元旦在朝日新聞上公布。公布後曾進行為期 17 年的定點觀測，進入 21 世紀後則以「想永遠守護的日本自然」為主題延續相關攝影與保育推廣。\n","figs":[{"n":"45,000+","l":"件應徵投稿"},{"n":"2,000+","l":"處候選地"},{"n":"100","l":"處入選，遍及 47 都道府縣"},{"n":"17 年","l":"於 10 個地點定點觀測"}],"mapTitle":"依地圖與類型瀏覽","mapHint":"點選縣份只看當地；顏色越深，符合條件的地點越多。","cats":[{"id":"f","name":"森林","color":"#2f7a52"},{"id":"m","name":"山岳・丘陵","color":"#8a6d45"},{"id":"v","name":"溪谷・瀑布","color":"#2f8f8c"},{"id":"w","name":"濕原","color":"#8fa13a"},{"id":"r","name":"河川・湖沼","color":"#2f6fae"},{"id":"c","name":"海岸・島嶼","color":"#c98a25"}],"items":[{"id":"i1","no":1,"pref":"北海道","name":"知床半島的天然林","jp":"知床半島の自然林","loc":"斜里郡斜里町・目梨郡羅臼町","desc":"知床連峰西側被譽為日本最原始的景觀。","cat":"f","note":"","url":"","img":null,"gq":""},{"id":"i2","no":2,"pref":"北海道","name":"釧路濕原","jp":"釧路湿原","loc":"釧路市・釧路郡釧路町・川上郡標茶町・阿寒郡鶴居村","desc":"以丹頂鶴棲息地聞名，是日本國內最大的低位濕原。","cat":"w","note":"","url":"","img":null,"gq":""},{"id":"i3","no":3,"pref":"北海道","name":"富良野的樹海","jp":"富良野の樹海","loc":"空知郡上富良野町・中富良野町・南富良野町","desc":"以東京大學演習林為中心，綿延約23,000公頃的廣大林地。","cat":"f","note":"","url":"","img":null,"gq":""},{"id":"i4","no":4,"pref":"北海道","name":"函館山","jp":"函館山","loc":"函館市西部","desc":"雖是觀光名勝，卻能看到北海道三分之一的植物種類，堪稱寶庫。","cat":"m","note":"","url":"","img":null,"gq":""},{"id":"i5","no":5,"pref":"青森","name":"屏風山濕原","jp":"屏風山湿原","loc":"西津輕郡木造町","desc":"從高位到低位，可以觀察各類濕原逐年演變的樣貌。","cat":"w","note":"","url":"","img":null,"gq":""},{"id":"i6","no":6,"pref":"青森","name":"蔦溫泉的天然林","jp":"蔦温泉の自然林","loc":"上北郡十和田湖町奧瀨","desc":"山毛櫸、七葉樹等天然林，還有只長得出低矮灌木的典型雪田。","cat":"f","note":"","url":"","img":null,"gq":""},{"id":"i7","no":7,"pref":"岩手","name":"櫃取濕原","jp":"櫃取湿原","loc":"下閉伊郡岩泉町","desc":"位於海拔約1,000公尺的國有林谷底，水芭蕉成片群生。","cat":"w","note":"","url":"","img":null,"gq":""},{"id":"i8","no":8,"pref":"岩手","name":"五葉山","jp":"五葉山","loc":"大船渡市・釜石市・氣仙郡住田町","d 林中也有日本鬣羚棲息。","cat":"v","note":"","url":"","img":null,"gq":""},{"id":"i96","no":96,"pref":"鹿兒島","name":"高隈山的照葉樹林","jp":"高隈山の照葉樹林","loc":"垂水市・鹿屋市","desc":"可以看到長果錐、蚊母樹、赤皮青岡林的垂直分布。","cat":"f","note":"","url":"","img":null,"gq":""},{"id":"i97","no":97,"pref":"鹿兒島","name":"屋久島的天然林","jp":"屋久島の自然林","loc":"熊毛郡屋久町・上屋久町","desc":"瀨切川右岸有照葉樹林的垂直分布，海岸一帶有亞熱帶植物。","cat":"f","note":"","url":"","img":null,"gq":""},{"id":"i98","no":98,"pref":"沖繩","name":"八重岳","jp":"八重岳","loc":"國頭郡本部町","desc":"約4公里的山路兩旁種著緋寒櫻，也有沖繩特有的野生動物。","cat":"m","note":"","url":"","img":null,"gq":""},{"id":"i99","no":99,"pref":"沖繩","name":"石垣島・川平灣","jp":"石垣島・川平湾","loc":"石垣市川平","desc":"灣內有隆起珊瑚礁形成的小島，海面上漂著黑珍珠養殖筏。","cat":"c","note":"","url":"","img":null,"gq":""},{"id":"i100","no":100,"pref":"沖繩","name":"西表島","jp":"西表島","loc":"八重山郡竹富町西表","desc":"被稱為「東洋的加拉巴哥群島」，保有沖繩最原始的自然。","cat":"c","note":"","url":"","img":null,"gq":""}],"about":[{"h":"日本自然 100 選（日本の自然 100 選）名單的由來","body":"1982 年的徵選共收到超過 4 萬 5000 件投稿，候選地多達 2000 處以上，最終入選的 100 個地點於 1983 年元旦在《朝日新聞》上公佈。。\n森林文化協會在迎接 21 世紀前的 17 年間，持續在其中 10 個地點做定點觀測，記錄自然的變化。由於國家公園等已受保護區域被排除在外，因此許多提名地點都是人們熟知的自然區域或面臨破壞風險的自然區域。\n進入21世紀後，活動更名為「想永遠守護的日本自然」（いつまでも守り続けたい日本の自然），對象擴大到入選地與國家公園在內的日本所有自然環境。\n"},{"h":"注意事項","body":"・所在地為 1983 年元旦當時的地名，之後經市町村合併，部分地名已經改變。\n・概要（選定理由）描述的是選定當時的狀況。\n"}],"src":"資料來源：森林文化協會「日本の自然100選」。中文為翻譯整理。"}</script>

/* ---------- build & export ---------- */
const jsonIn=s=>JSON.stringify(s).replace(/</g,'\\u003c');
const tight=s=>s.replace(/\n[ \t]*(?=\n)/g,'').replace(/^\n+/,'');
function staticBody(st){const keep={S,editing,EMBED,ui:{...ui}};S=st;editing=false;EMBED=true;STATIC=true;ui.cat='';ui.pf='';ui.q='';
  try{const present=PREFS.filter(p=>S.items.some(d=>d.pref===p));
  const radios=`<input type="radio" class="sr" name="nl-c" id="nl-c-all" checked aria-label="全部類型">${S.cats.map((c,k)=>`<input type="radio" class="sr" name="nl-c" id="nl-c-${k}" aria-label="${esc(c.name)}">`).join('')}<input type="radio" class="sr" name="nl-p" id="nl-p-all" checked aria-label="全部縣份">${present.map(p=>`<input type="radio" class="sr" name="nl-p" id="nl-p-${PI[p]}" aria-label="${esc(full(p))}">`).join('')}`;
  return `<style>${staticRules(present)}</style>${radios}<header class="hero band" id="nl-hero">${heroHTML()}</header><main class="band wrap main"><aside class="side" id="nl-side">${sideHTML()}</aside><section id="nl-list" aria-live="polite">${listHTML()}</section></main><section class="band about" id="nl-about">${aboutHTML()}</section>${SYM()}`.replace(/\n/g,' ')}
  finally{S=keep.S;editing=keep.editing;EMBED=keep.EMBED;STATIC=false;Object.assign(ui,keep.ui)}}
function buildDoc(st,mode,pre){return `<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>${esc(st.title||'主題頁面')}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="${FONTS}" rel="stylesheet">
<style>:root{color-scheme:light dark}:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}html,body{margin:0;background:light-dark(#fff,#0d1612)}</style>
<style id="nl-css">${tight(CSS)}</style>
</head>
<body>
<div class="nl" id="nl-app" data-mode="${mode}">${pre||''}</div>
<script type="application/json" id="nl-state">${jsonIn(st)}${SC}
<script id="nl-js">${tight(JS)}${SC}
</body>
</html>
`}
function buildFrag(st,pre){return `<link href="${FONTS}" rel="stylesheet">
<style id="nl-css">${tight(CSS)}</style>
<div class="nl light" id="nl-app" data-mode="view">${pre||''}</div>
<script type="application/json" id="nl-state">${jsonIn(st)}${SC}
<script id="nl-js">${tight(JS)}${SC}
`}
const dataCache={};
async function exportState(){
  const st=JSON.parse(JSON.stringify(S));let n=0,lost=0;
  for(const it of st.items){const im=it.img;if(!im)continue;
    if(im.k==='asset'){try{if(!dataCache[im.id]){const r=await fetch('/_blob/'+im.id);if(!r.ok)throw 0;dataCache[im.id]=await toData(await r.blob())}it.img={k:'data',src:dataCache[im.id]};n++}catch(e){it.img=null;lost++}}
    else if(im.k==='data')n++;}
  return {st,n,lost};
}
const slug=()=>String(S.title||'page').replace(/[\\/:*?"<>|\s]+/g,'-').slice(0,60)||'page';
function openExport(){
  openModal(`<h2>匯出頁面</h2><p class="small" style="margin:-8px 0 16px">匯出的是目前畫面上的內容（包含還沒儲存的變更），不含編輯功能；上傳的照片會一起嵌進去。</p>
<div class="xopts"><div class="xo"><h3>完整網頁</h3><p>單一 .html 檔，可以直接用瀏覽器開啟，或上傳到主機。</p><div class="row"><button type="button" class="btn pri" data-x="full" disabled>下載 .html</button></div></div>
<div class="xo"><h3>可編輯版本</h3><p>單一 .html，保留編輯功能。在電腦上用瀏覽器開啟就能編輯，改完按「下載存檔」存成新檔。</p><div class="row"><button type="button" class="btn pri" data-x="edit" disabled>下載編輯版</button></div></div>
<div class="xo"><h3>WordPress 區塊用</h3><p>貼進文章的「自訂 HTML」區塊。固定以淺色顯示，樣式只作用在這個區塊裡。</p><div class="row"><button type="button" class="btn pri" data-x="copy" disabled>複製 HTML</button><button type="button" class="btn" data-x="wp" disabled>下載 .html</button></div></div></div>
<p class="err" id="x-msg" role="status">準備中…</p><div id="x-more"></div><textarea class="code" id="x-code" readonly hidden aria-label="匯出的 HTML"></textarea>`,async b=>{
    const msg=b.querySelector('#x-msg'),code=b.querySelector('#x-code'),more=b.querySelector('#x-more');
    const {st,n,lost}=await exportState();
    const pre=staticBody(st);
    const out={full:buildDoc(st,'view',pre),wp:buildFrag(st,pre),edit:buildDoc(st,'edit')};
    const mb=s=>(new Blob([s]).size/1048576).toFixed(1);
    const info=k=>`${n?`含 ${n} 張照片，`:''}約 ${mb(out[k])} MB${lost?`；有 ${lost} 張照片讀取失敗，已略過`:''}。`;
    b.querySelectorAll('[data-x]').forEach(x=>x.disabled=false);msg.textContent='';
    const showCode=(k,why)=>{code.hidden=false;code.value=out[k];msg.textContent=why+info(k);more.innerHTML='<div class="row" style="margin-top:8px"><button type="button" class="btn pri" data-x="copyall" data-k="'+k+'">複製全部</button></div>'};
    const dl=(k,ext)=>{const name=slug()+(k==='wp'?'-wordpress':k==='edit'?'-編輯版':'')+ext;
      if(!DL&&LOCAL&&fileDL(out[k],name)){msg.textContent=`已下載 ${name}。`+info(k);return}
      if(!DL){showCode(k,'這個畫面沒有開放下載功能。請按「複製全部」，貼到記事本或 VS Code 存成 .html；或用瀏覽器分頁直接開啟這個頁面再試一次下載。');return}
      DL.save({filename:name,data:new Blob([out[k]],{type:'text/plain'})}).then(()=>{msg.textContent=`已下載 ${name}。`+info(k)+(ext==='.txt'?' 下載後把副檔名 .txt 改成 .html 即可。':'');more.innerHTML='';code.hidden=true}).catch(err=>{const c=err&&err.code;
        if(c==='declined'){msg.textContent='已取消下載。';return}
        if((c==='extension_not_enabled'||c==='rejected_extension')&&ext==='.html'){msg.textContent='這個檢視不能下載 .html 檔。可以改下載成 .txt，下載後把副檔名改成 .html。';more.innerHTML='<div class="row" style="margin-top:8px"><button type="button" class="btn pri" data-x="txt" data-k="'+k+'">下載 .txt</button><button type="button" class="btn" data-x="show" data-k="'+k+'">改用複製</button></div>';return}
        if(c==='host_unavailable'){showCode(k,'這個 App 無法存檔，請改用電腦瀏覽器開啟，或複製下方內容。');return}
        if(c==='rate_limited'){msg.textContent='下載視窗已經開著或太頻繁，請稍等再按一次。';return}
        showCode(k,`下載失敗（${c||'未知原因'}），可以複製下方內容。`)});};
    const copy=k=>{const done=()=>{msg.textContent='已複製。'+info(k);more.innerHTML='';code.hidden=true};
      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(out[k]).then(done).catch(()=>showCode(k,'無法直接複製，請點下方框框，全選（Ctrl＋A／⌘＋A）後複製。'))}
      else showCode(k,'無法直接複製，請點下方框框，全選後複製。')};
    b.addEventListener('click',e=>{const t=e.target.closest('[data-x]');if(!t||t.disabled)return;const x=t.dataset.x,k=t.dataset.k;
      if(x==='full')dl('full','.html');else if(x==='edit')dl('edit','.html');else if(x==='wp')dl('wp','.html');else if(x==='copy')copy('wp');
      else if(x==='txt')dl(k,'.txt');else if(x==='show')showCode(k,'請點下方框框，全選後複製。');
      else if(x==='copyall'){code.focus();code.select();copy(k)}});
  });
}
async function saveLocal(){
  const {st,lost}=await exportState();const name=slug()+'-編輯版.html';
  if(!fileDL(buildDoc(st,'edit'),name)){toast('無法下載，請改用「匯出頁面」複製內容');return}
  savedJSON=JSON.stringify(S);try{localStorage.removeItem(DKEY)}catch(e){}renderBar();
  toast(`已下載 ${name}${lost?`（${lost} 張照片讀取失敗）`:''}，下次開這個新檔繼續編輯`);
}
async function save(){
  if(!ART||readOnly)return;
  const btn=root.querySelector('[data-act="save"]');if(btn){btn.disabled=true;btn.textContent='儲存中…'}
  try{await ART.publish(buildDoc(S,'edit'))}
  catch(e){const c=e&&e.code;
    if(c==='conflict'){toast('頁面在別處更新過，重新載入中；未儲存的內容會留在草稿裡')}
    else if(c==='not_writer'||c==='not_granted'||c==='not_declared'||c==='capability_disabled'||c==='consent_required'){readOnly=true;toast('這個檢視無法儲存')}
    else if(c==='too_large'){toast('頁面太大無法儲存，請移除一些內嵌照片')}
    else toast('儲存失敗，請稍後再試');
    renderBar();}
}
/* ---------- events ---------- */
root.addEventListener('click',e=>{
  const t=e.target.closest('.t');if(t&&root.contains(t)&&t.closest('#nl-map')){if(t.dataset.n==='0'&&ui.pf!==t.dataset.p)return;ui.pf=ui.pf===t.dataset.p?'':t.dataset.p;renderList();return}
  const c=e.target.closest('#nl-chips .chip');if(c){ui.cat=c.dataset.c;renderList();return}
  if(e.target.closest('#nl-fab')){editing=true;renderAll();return}
  if(e.target.closest('.close')||e.target.id==='nl-modal'){closeModal();return}
  const a=e.target.closest('[data-act]');if(!a)return;
  const act=a.dataset.act;
  if(act==='reset'){ui.cat='';ui.pf='';ui.q='';const q=$('#nl-q');if(q)q.value='';renderList()}
  else if(act==='edit')editItem(a.dataset.id);
  else if(act==='add')editItem(null);
  else if(act==='cats')editCats();
  else if(act==='export')openExport();
  else if(act==='save')save();
  else if(act==='savelocal')saveLocal();
  else if(act==='done'){editing=false;renderAll()}
  else if(act==='undo'){if(!undo.length)return;S=JSON.parse(undo.pop());renderAll();changed()}
  else if(act==='addfig'){pushUndo();S.figs.push({n:'',l:''});renderHero();changed();const f=root.querySelectorAll('.fig1 b');if(f.length)f[f.length-1].focus()}
  else if(act==='delfig'){pushUndo();S.figs.splice(+a.dataset.i,1);renderHero();changed()}
  else if(act==='addcol'){pushUndo();S.about.push({h:'',body:''});renderAbout();changed()}
  else if(act==='delcol'){pushUndo();S.about.splice(+a.dataset.i,1);renderAbout();changed()}
});
root.addEventListener('change',e=>{if(e.target.id==='nl-pf'){ui.pf=e.target.value;renderList()}});
root.addEventListener('input',e=>{
  if(e.target.id==='nl-q'){ui.q=e.target.value.trim();renderList();return}
  const el=e.target.closest&&e.target.closest('[data-k]');
  if(el&&editing){setPath(el.dataset.k,el.dataset.multi!==undefined?txt(el).replace(/\n{3,}/g,'\n\n'):txt(el).replace(/\s*\n\s*/g,' '));changed()}
});
root.addEventListener('focusin',e=>{if(editing&&e.target.closest&&e.target.closest('[data-k]'))pushUndo()});
root.addEventListener('focusout',e=>{const el=e.target.closest&&e.target.closest('[data-k]');if(el&&editing&&el.dataset.k==='title'){document.title=S.title||document.title}});
root.addEventListener('keydown',e=>{const el=e.target.closest&&e.target.closest('[data-k]');if(el&&e.key==='Enter'&&el.dataset.multi===undefined){e.preventDefault();el.blur()}});
document.addEventListener('keydown',e=>{
  if(MODE!=='edit')return;
  if(e.key==='Escape'&&!$('#nl-modal').hidden){closeModal();return}
  const tg=e.target;const typing=tg&&(tg.isContentEditable||/^(INPUT|TEXTAREA|SELECT)$/.test(tg.tagName));
  if(editing&&!typing&&(e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&undo.length){e.preventDefault();S=JSON.parse(undo.pop());renderAll();changed()}
});
/* ---------- boot ---------- */
shell();renderAll();
if(MODE==='edit'){
  let draft=null;try{draft=localStorage.getItem(DKEY)}catch(e){}
  if(draft&&draft!==savedJSON){try{JSON.parse(draft);const n=$('#nl-notice');n.className='notice';n.innerHTML='<span>這個瀏覽器裡有上次還沒儲存的變更。</span><button type="button" class="btn pri" id="nl-restore">還原</button><button type="button" class="btn" id="nl-drop">捨棄</button>';
    n.querySelector('#nl-restore').addEventListener('click',()=>{pushUndo();S=JSON.parse(draft);editing=true;n.innerHTML='';n.className='';renderAll()});
    n.querySelector('#nl-drop').addEventListener('click',()=>{try{localStorage.removeItem(DKEY)}catch(e){}n.innerHTML='';n.className=''});}catch(e){}}
  else if(draft){try{localStorage.removeItem(DKEY)}catch(e){}}
  if(window.claude&&typeof window.claude.use==='function'){
    window.claude.use('artifact').then(a=>{ART=a;if(!a)readOnly=true;renderBar()}).catch(()=>{readOnly=true;renderBar()});
    window.claude.use('assets').then(a=>{ASSETS=a}).catch(()=>{});
    window.claude.use('downloads').then(d=>{DL=d}).catch(()=>{});
  }else{readOnly=true;renderBar()}
}
}
}
</script>
</body>
</html>
